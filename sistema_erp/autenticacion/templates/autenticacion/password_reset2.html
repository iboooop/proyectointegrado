{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'productos/css/styles.css' %}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, rgba(209, 10, 17, 0.85) 0%, rgba(163, 9, 14, 0.9) 100%),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23230E00" width="100" height="100"/></svg>');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .form-container {
            background: white;
            border-radius: 18px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 420px;
            width: 100%;
        }

        .form-container h1 {
            text-align: center;
            color: #121826;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .form-logo {
            display: block;
            max-width: 180px;
            margin: 0 auto 2rem auto;
        }

        .form-container label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 4px;
            display: block;
        }

        .form-container input[type="email"],
        .form-container input[type="password"],
        .form-container input[type="text"] {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            padding: 0.65rem 0.85rem;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 1rem;
        }

        .form-container input:focus {
            outline: none;
            border-color: #D10A11;
            box-shadow: 0 0 0 3px rgba(209, 10, 17, 0.15);
        }

        .form-container .btn {
            border-radius: 999px;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.6rem 1.6rem;
        }

        .form-container .btn-primary {
            background-color: #D10A11 !important;
            border-color: #D10A11 !important;
            color: white;
        }

        .form-container .btn-primary:hover {
            background-color: #a3090e !important;
            border-color: #a3090e !important;
        }

        .form-container .btn-secondary {
            color: #4b5563 !important;
            border-color: #d1d5db !important;
            background-color: #ffffff !important;
        }

        .form-container .btn-secondary:hover {
            background-color: #f3f4f6 !important;
            color: #111827 !important;
        }

        .form-container p {
            text-align: center;
            margin-top: 1rem;
        }

        .alert {
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Restablecer contraseña</h1>
        
        <!-- Logo centrado -->
        <img src="{% static 'assets/logolilis_ver1.png' %}" alt="Lilis" class="form-logo">
        <form method="post">
            {% csrf_token %}
            <label for="nueva_password">Nueva contraseña:</label>
            <input type="password" name="nueva_password" id="nueva_password" required>
            <label for="confirmar_password">Confirmar contraseña:</label>
            <input type="password" name="confirmar_password" id="confirmar_password" required>
            <button type="submit" class="btn btn-primary">Restablecer</button>
        </form>
        <p><a href="{% url 'login' %}" class="btn btn-secondary">Volver al inicio de sesión</a></p>
    </div>
</body>
</html>
