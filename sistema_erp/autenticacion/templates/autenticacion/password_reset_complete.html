{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contraseña cambiada - Lilis ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'productos/css/styles.css' %}" rel="stylesheet">
  <style>
    body{background:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#111827;}
    .page-wrap{max-width:720px;margin:48px auto;padding:0 16px;}
    .card{border-radius:12px;}
    .hero-title{font-size:1.25rem;font-weight:700;color:#0f1724}
    .muted{color:#6b7280}
    .btn-primary{background:#c91b1b;border-color:#c91b1b}
    .success-badge{width:84px;height:84px;border-radius:999px;background:linear-gradient(180deg,#e9c7c7,#f7eaea);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
    .success-icon{font-size:34px;color:#9b1d1d}
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <img src="{% static 'assets/logolilis_ver1.png' %}" alt="Lilis" width="64" class="mb-3">
        <div class="success-badge mb-3">
          <span class="success-icon">✓</span>
        </div>
        <div class="hero-title mb-2">Tu contraseña ha sido cambiada correctamente</div>
        <p class="muted mb-4">Ya puedes iniciar sesión con tu nueva contraseña.</p>

        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'login' %}" class="btn btn-primary">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
