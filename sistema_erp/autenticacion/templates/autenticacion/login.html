{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="login-container">
        <h1>Iniciar sesión</h1>

        <form id="loginForm" method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div style="display:flex; gap:12px; justify-content:center; align-items:center; margin-top:16px; flex-wrap:wrap;">
                <button type="submit" class="btn btn-primary">Iniciar sesi</button>
            </div>
        </form>
        <div style="text-align:center; margin-top:12px;">
            <a href="{% url 'recuperar_password' %}">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');

        // Validación cliente simple
        form.addEventListener('submit', function(e) {
            const username = form.querySelector('input[name="username"]');
            const password = form.querySelector('input[name="password"]');
            const errors = [];

            if (!username || !username.value.trim()) {
                errors.push('Ingrese su usuario.');
            }
            if (!password || password.value.trim().length < 6) {
                errors.push('La contraseña debe tener al menos 6 caracteres.');
            }

            if (errors.length) {
                e.preventDefault();
                Swal.fire({
                    icon: 'error',
                    title: 'Errores en el formulario',
                    html: errors.join('<br>')
                });
            }
        });

        // Mostrar mensajes enviados desde el servidor con Django messages
        const messages = [
        {% if messages %}
            {% for message in messages %}
                {"tags": "{{ message.tags }}", "text": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}
            {% endfor %}
        {% endif %}
        ];

        messages.forEach(function(m) {
            if (!m.text) return;
            if (m.tags.includes('success')) {
                // Si el mensaje contiene "Bienvenido", muestra el SweetAlert personalizado
                if (m.text.startsWith('Bienvenido')) {
                    Swal.fire({
                        icon: 'success',
                        title: m.text,
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({ icon: 'success', title: 'Éxito', text: m.text });
                }
            } else if (m.tags.includes('error') || m.tags.includes('warning') || m.tags.includes('danger')) {
                Swal.fire({ icon: 'error', title: 'Error', text: m.text });
            } else {
                Swal.fire({ icon: 'info', title: 'Información', text: m.text });
            }
        });
    });
    </script>
</body>
</html>
