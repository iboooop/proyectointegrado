{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Movimiento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'transacciones/css/transacciones.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="container my-5">
    <a href="{% url 'detalle_transaccion' transaccion.id %}" class="btn btn-outline-secondary mb-3">&larr; Volver al detalle</a>

    <div class="card">
      <div class="card-header card-header-dark">
        <h4 class="mb-0">Editar Movimiento</h4>
      </div>

      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-edit me-2">Guardar cambios</button>
            <a href="{% url 'detalle_transaccion' transaccion.id %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
