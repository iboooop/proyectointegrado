{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Listado de Movimientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'transacciones/css/transacciones.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background: #f8f9fa; }
    .card { border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-header {
      background: #212529;
      color: white;
      font-weight: 600;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .table th { background-color: #f1f3f4; }
    .btn-outline-primary {
      border-color: #0d6efd;
      color: #0d6efd;
      transition: all 0.2s;
    }
    .btn-outline-primary:hover {
      background-color: #0d6efd;
      color: white;
    }
    .btn-create {
      background: #198754;
      color: #fff;
      border: none;
    }
    .btn-create:hover {
      background: #157347;
      color: #fff;
    }
    .footer {
      background: #212529;
      color: #fff;
      padding: 0.5rem 2rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body class="trx-list">
  <div class="container my-5">
    <a href="/" class="btn btn-outline-secondary mb-3">&larr; Volver al dashboard</a>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Movimientos de Inventario</span>
        <div>
          <a href="{% url 'transacciones_export' %}?q={{ q }}&sort={{ sort }}&dir={{ dir }}" class="btn btn-success me-2">Exportar Excel</a>
          <a href="{% url 'crear_transaccion' %}" class="btn btn-create">+ Crear Movimiento</a>
        </div>
      </div>

      <div class="card-body">
        <form method="get" class="row g-2 align-items-end mb-3">
          <div class="col-md-5">
            <input type="text" name="q" id="searchInput" value="{{ request.GET.q }}" class="form-control" placeholder="Buscar (producto, proveedor, tipo, usuario, lote, doc ref)">
          </div>
          <div class="col-md-2">
            <select name="page_size" class="form-select" onchange="this.form.submit()">
              {% for n in page_sizes %}
                <option value="{{ n }}" {% if page_size == n %}selected{% endif %}>{{ n }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
            <a href="{% url 'lista_transacciones' %}" class="btn btn-outline-secondary">Limpiar filtro</a>
          </div>
          <div class="col-md-3 text-end text-muted small pt-2">
            Total: {{ paginator.count }} registros
          </div>
        </form>

        <div id="trxTableWrap">
          {% include 'transacciones/partials/transaccion_table.html' %}
        </div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);
      const showAlert = (icon, title, text) => {
        Swal.fire({ icon, title, text, timer: 2000, timerProgressBar: true, showConfirmButton: false, confirmButtonColor: '#2563eb' });
      };
      if (params.get('created')==='1') { showAlert('success', 'Movimiento creado', 'Se registró correctamente.'); params.delete('created'); }
      if (params.get('updated')==='1') { showAlert('success', 'Movimiento actualizado', 'Se guardaron los cambios.'); params.delete('updated'); }
      if (params.get('deleted')==='1') { showAlert('success', 'Movimiento eliminado', 'Se eliminó correctamente.'); params.delete('deleted'); }
      if (window.history && params.toString() !== window.location.search.substring(1)) {
        const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
        window.history.replaceState({}, '', newUrl);
      }
    })();
  </script>
  <script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  const tableWrap = document.getElementById('trxTableWrap');
  let timeout = null;

  searchInput.addEventListener('input', function() {
    clearTimeout(timeout);
    timeout = setTimeout(function() {
      const q = searchInput.value;
      const params = new URLSearchParams(window.location.search);
      params.set('q', q);
      params.set('page', 1); // Reinicia a la primera página al buscar

      fetch(window.location.pathname + '?' + params.toString(), {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      })
      .then(response => response.text())
      .then(html => {
        // Extrae solo la tabla de la respuesta
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const newTable = doc.getElementById('trxTableWrap');
        if (newTable) tableWrap.innerHTML = newTable.innerHTML;
      });
    }, 350); // Espera 350ms después de dejar de escribir
  });
});
</script>
{% include 'partials/footer.html' %}
</body>
</html>
