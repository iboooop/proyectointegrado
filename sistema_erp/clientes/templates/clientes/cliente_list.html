{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Listado de Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'transacciones/css/transacciones.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="trx-list">
  <div class="container my-5">
    <a href="/" class="btn btn-outline-secondary mb-3">&larr; Volver al dashboard</a>

    <div class="card">
      <div class="card-header card-header-dark d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <span>Listado de Clientes</span>
        </div>
        <div class="d-flex gap-2">
          <a href="{% url 'clientes_export' %}?q={{ q }}&sort={{ sort }}&dir={{ dir }}" class="btn btn-success">Exportar Excel</a>
          <a href="{% url 'clientes_create' %}" class="btn btn-create">+ Crear Cliente</a>
        </div>
      </div>

      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <form id="searchForm" class="flex-grow-1 me-3" onsubmit="return false;">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar (nombre, RUT, email, teléfono...)" value="{{ q }}">
          </form>
          <form id="pageSizeForm" class="d-flex align-items-center gap-2" onsubmit="return false;">
            <label for="pageSizeSelect" class="form-label m-0">Filas por página:</label>
            <select id="pageSizeSelect" class="form-select" style="width: 140px;">
              {% for n in page_sizes %}
              <option value="{{ n }}" {% if page_size == n %}selected{% endif %}>{{ n }}</option>
              {% endfor %}
            </select>
          </form>
          <div class="text-muted small">Total: {{ paginator.count }} registros</div>
        </div>

        <div id="clientesTableWrap">
          {% include 'clientes/partials/cliente_table.html' %}
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const wrap = document.getElementById('clientesTableWrap');
      const searchInput = document.getElementById('searchInput');
      const pageSizeSelect = document.getElementById('pageSizeSelect');
      let debounceTimer = null;

      async function fetchAndUpdate(url){
        const resp = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }});
        const html = await resp.text();
        // ✅ Evita duplicados verificando si viene solo la tabla o la página entera
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const newTable = doc.querySelector('#clientesTableWrap') || doc;
        wrap.innerHTML = newTable.innerHTML;

        attachJumpHandler();
      }

      function buildUrl(){
        const p = new URLSearchParams(window.location.search);
        const qVal = (searchInput?.value || '').trim();
        if (qVal) p.set('q', qVal); else p.delete('q');
        if (pageSizeSelect?.value) p.set('page_size', pageSizeSelect.value);
        p.delete('page');
        p.set('partial', '1');
        return window.location.pathname + '?' + p.toString();
      }

      if (searchInput){
        searchInput.addEventListener('input', function(){
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(()=>fetchAndUpdate(buildUrl()), 300);
        });
      }

      if (pageSizeSelect){
        pageSizeSelect.addEventListener('change', ()=>{
          fetchAndUpdate(buildUrl());
        });
      }

      wrap.addEventListener('click', async e=>{
        const a = e.target.closest('a.page-link, thead a');
        if (a && a.getAttribute('href')){
          e.preventDefault();
          const clean = a.getAttribute('href');
          await fetchAndUpdate(clean + '&partial=1');
          window.history.replaceState({}, '', clean);
        }
      });

      function attachJumpHandler(){
        const form = wrap.querySelector('#jumpPageForm');
        if (!form) return;
        const input = form.querySelector('#jumpPageInput');
        const btn = form.querySelector('#jumpGoBtn');
        btn?.addEventListener('click', async function(){
          let target = parseInt(input.value, 10);
          if (isNaN(target) || target < 1) target = 1;
          const max = parseInt(input.getAttribute('max'), 10) || 1;
          if (target > max) target = max;
          const p = new URLSearchParams(window.location.search);
          p.set('page', target);
          p.set('partial', '1');
          await fetchAndUpdate(window.location.pathname + '?' + p.toString());
        });
      }
      attachJumpHandler();
    })();
  </script>

  {% include 'partials/footer.html' %}
</body>
</html>
