<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Listado de Proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }

    .card {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      background: #212529;
      color: white;
    }

    .table th {
      background-color: #f1f3f4;
    }

    .footer {
      background: #212529;
      color: #fff;
      padding: 0.5rem 2rem;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <div class="container my-5">
    <a href="/" class="btn btn-outline-secondary mb-3">&larr; Volver al dashboard</a>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Listado de Proveedores</span>
        <div class="d-flex gap-2">
          <a href="{% url 'proveedores_export' %}" class="btn btn-success">Exportar Excel</a>
          {% if request.user.perfil.rol != 'LECTOR' %}
            <a href="{% url 'proveedor_agregar' %}" class="btn btn-primary">+ Crear proveedor</a>
          {% endif %}
        </div>
      </div>

      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <form id="searchForm" class="flex-grow-1 me-3" onsubmit="return false;">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar (nombre, RUT, contacto...)"
              value="{{ q }}">
          </form>
          <form id="pageSizeForm" class="d-flex align-items-center gap-2" onsubmit="return false;">
            <label for="pageSizeSelect" class="form-label m-0">Filas por página:</label>
            <select id="pageSizeSelect" class="form-select" style="width: 140px;">
              {% for n in page_sizes %}
              <option value="{{ n }}" {% if page_size == n %}selected{% endif %}>{{ n }}</option>
              {% endfor %}
            </select>
          </form>
          <div class="text-muted small">Total: {{ paginator.count }} registros</div>
        </div>

        <div id="proveedoresTableWrap">
          {% include 'proveedores/partials/proveedor_table.html' %}
        </div>
      </div>
    </div>
  </div>

  <div class="footer d-flex justify-content-between align-items-center">
    <span>&copy; 2025 Sistema ERP</span>
    <span>Soporte</span>
  </div>
  <script>
  (function(){
    const wrap = document.getElementById('proveedoresTableWrap');
    const searchInput = document.getElementById('searchInput');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    let debounceTimer = null;

    async function fetchAndUpdate(url){
      const resp = await fetch(url, { headers: { 'X-Requested-With':'XMLHttpRequest' }});
      const html = await resp.text();
      wrap.innerHTML = html;
      attachJumpHandler();
    }

    function buildUrl(){
      const p = new URLSearchParams(window.location.search);
      const qVal = (searchInput?.value || '').trim();
      if (qVal) p.set('q', qVal); else p.delete('q');
      if (pageSizeSelect?.value) p.set('page_size', pageSizeSelect.value);
      p.delete('page');
      p.set('partial','1');
      return window.location.pathname + '?' + p.toString();
    }

    function updateUrlOnly(){
      const p = new URLSearchParams(window.location.search);
      const qVal = (searchInput?.value || '').trim();
      if (qVal) p.set('q', qVal); else p.delete('q');
      if (pageSizeSelect?.value) p.set('page_size', pageSizeSelect.value);
      const newUrl = window.location.pathname + (p.toString()? '?' + p.toString() : '');
      window.history.replaceState({}, '', newUrl);
    }

    if (searchInput) {
      searchInput.addEventListener('input', function(){
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async ()=>{
          await fetchAndUpdate(buildUrl());
          updateUrlOnly();
        }, 300);
      });
    }

    if (pageSizeSelect) {
      pageSizeSelect.addEventListener('change', async function(){
        const p = new URLSearchParams(window.location.search);
        p.set('page_size', this.value); p.delete('page'); p.set('partial','1');
        await fetchAndUpdate(window.location.pathname + '?' + p.toString());
        p.delete('partial');
        window.history.replaceState({}, '', window.location.pathname + '?' + p.toString());
      });
    }

    // interceptar clicks de paginación
    wrap.addEventListener('click', async function(e){
      const a = e.target.closest('a.page-link, thead a');
      if (a && a.getAttribute('href')) {
        e.preventDefault();
        const clean = a.getAttribute('href');
        await fetchAndUpdate(clean + '&partial=1');
        window.history.replaceState({}, '', clean);
      }
    });

    // salto a página
    function attachJumpHandler(){
      const form = wrap.querySelector('#jumpPageForm');
      if (!form) return;
      const input = form.querySelector('#jumpPageInput');
      const btn = form.querySelector('#jumpGoBtn');
      if (!btn) return;
      btn.addEventListener('click', async function(){
        let target = parseInt(input.value, 10);
        if (isNaN(target) || target < 1) target = 1;
        const max = parseInt(input.getAttribute('max'), 10) || 1;
        if (target > max) target = max;
        const p = new URLSearchParams(window.location.search);
        p.set('page', target);
        p.set('partial','1');
        if (pageSizeSelect?.value) p.set('page_size', pageSizeSelect.value);
        await fetchAndUpdate(window.location.pathname + '?' + p.toString());
        p.delete('partial');
        window.history.replaceState({}, '', window.location.pathname + '?' + p.toString());
      });
    }

    attachJumpHandler();
  })();
  </script>

</body>

</html>
