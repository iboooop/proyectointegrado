<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Listado de Proveedores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }

    .card {
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      background: #212529;
      color: white;
    }

    .table th {
      background-color: #f1f3f4;
    }

    .footer {
      background: #212529;
      color: #fff;
      padding: 0.5rem 2rem;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <div class="container my-5">
    <a href="/" class="btn btn-outline-secondary mb-3">&larr; Volver al dashboard</a>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Listado de Proveedores</span>
        <div class="d-flex gap-2">
          <a href="{% url 'proveedores_export' %}" class="btn btn-success">Exportar Excel</a>
          <a href="{% url 'proveedor_agregar' %}" class="btn btn-primary">+ Crear proveedor</a>
        </div>
      </div>

      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <form id="searchForm" class="flex-grow-1 me-3" onsubmit="return false;">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar (nombre, RUT, contacto...)"
              value="{{ q }}">
          </form>
          <form id="pageSizeForm" class="d-flex align-items-center gap-2" onsubmit="return false;">
            <label for="pageSizeSelect" class="form-label m-0">Filas por página:</label>
            <select id="pageSizeSelect" class="form-select" style="width: 140px;">
              {% for n in page_sizes %}
              <option value="{{ n }}" {% if page_size == n %}selected{% endif %}>{{ n }}</option>
              {% endfor %}
            </select>
          </form>
          <div class="text-muted small">Total: {{ paginator.count }} registros</div>
        </div>

        <div id="proveedoresTableWrap">
          {% include 'proveedores/partials/proveedor_table.html' %}
        </div>
      </div>
    </div>
  </div>

  <div class="footer d-flex justify-content-between align-items-center">
    <span>&copy; 2025 Sistema ERP</span>
    <span>Soporte</span>
  </div>
</body>

</html>
