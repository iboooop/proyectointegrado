<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada - 404</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(2, 6, 23, 0.08);
            padding: 2rem;
            max-width: 640px;
            width: 100%;
            text-align: center;
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: #1d4ed8;
            letter-spacing: 2px;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: .25rem;
            margin-bottom: .5rem;
        }
        .error-desc { color: #475569; }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-title">Página no encontrada</div>
        <p class="error-desc">La URL a la que intentaste acceder no existe o ha sido movida. Verifica la dirección o vuelve al inicio.</p>
        <div class="d-flex gap-2 justify-content-center mt-3">
            <a href="/" class="btn btn-primary">Ir al Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Volver</a>
        </div>
    </div>
</div>
</body>
</html>
